<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso Restrito - Frivaca</title>

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    /* Ajustes da tela de login */
    :root {
      --egator-bg: #F8FAFC;
      --egator-card-bg: #FFFFFF;
      --egator-text-dark: #1E293B;
      --egator-text-muted: #64748B;
      --egator-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
      --egator-border-radius: 20px;
    }

    body.login-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background-color: var(--egator-bg);
      position: relative; 
    }

    /* Botao de tema flutuante */
    .btn-tema-flutuante {
      position: absolute;
      top: 24px;
      right: 24px;
      background: var(--egator-card-bg);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--egator-shadow);
      color: var(--egator-text-muted);
      transition: transform 0.2s;
    }
    .btn-tema-flutuante:hover { transform: scale(1.05); }

    .login-card {
      background-color: var(--egator-card-bg);
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: var(--egator-border-radius);
      box-shadow: var(--egator-shadow);
      border: none;
      margin-top: 40px;
    }

    .login-logo {
      display: block;
      max-height: 100px;
      margin: 0 auto 24px;
      object-fit: contain;
    }

    .login-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 1.8rem;
      color: var(--color-primary-dark);
      text-align: center;
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 0.9rem;
      color: var(--egator-text-muted);
      text-align: center;
      margin-bottom: 32px;
    }

    .login-card .form-label {
      font-weight: 600;
      color: var(--egator-text-dark);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .login-card .form-control {
      background-color: var(--egator-card-bg);
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      height: 48px;
      padding: 0 16px;
      font-size: 1rem;
      color: var(--egator-text-dark);
    }

    .login-card .form-control:focus {
      outline: none;
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(132, 204, 22, 0.2);
    }

    .login-card .btn {
      margin-top: 24px;
      height: 48px;
      background-color: var(--color-accent);
      color: var(--color-primary-dark);
      font-weight: 700;
      border-radius: 12px;
    }
    .login-card .btn:hover { background-color: var(--color-accent-hover); }

    @media (max-width: 640px) {
      .login-card { padding: 32px 24px; }
      .login-logo { max-height: 80px; }
      .login-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body class="login-page">

  <!-- Botao de tema -->
  <button id="btn-tema" class="btn-tema-flutuante" aria-label="Alternar Tema">
    <svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>

  <main class="login-card">
    <img src="assets/logofrivaca.png" alt="Frivaca - O Legítimo Laticínio" class="login-logo">

    <h1 class="login-title">Acesso Restrito</h1>
    <p class="login-subtitle">Informe seu nome para acessar o controle de estoque.</p>

    <div class="form-group">
      <label class="form-label" for="nome-admin">Nome do Administrador</label>
      <input class="form-control" type="text" id="nome-admin" name="nome-admin" autocomplete="name" maxlength="60" autofocus placeholder="Seu nome completo" aria-describedby="erro-nome">
      <p class="form-error" id="erro-nome" role="alert" hidden>Informe o nome do administrador para entrar.</p>
    </div>

    <button class="btn btn--block" type="button" id="btn-entrar">Entrar no Sistema</button>
  </main>

  <!-- Rodape manual pra tela de login -->
  <footer class="site-footer" style="border-top: none; margin-top: 40px; width: 100%; max-width: 420px;">
    <p>&copy; 2026 <strong>Frivaca</strong> &middot; O Legítimo Laticínio.</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (obterSessao()) {
        window.location.replace('index.html');
        return;
      }

      var input = document.getElementById('nome-admin');
      var erro = document.getElementById('erro-nome');

      document.getElementById('btn-entrar').addEventListener('click', login);

      input.addEventListener('keydown', function (evento) {
        if (evento.key === 'Enter') login();
      });

      input.addEventListener('input', function () {
        input.classList.remove('is-invalid');
        erro.hidden = true;
      });
    });
  </script>
</body>
</html>
